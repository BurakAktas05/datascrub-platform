server:
  port: 8080

spring:
  application:
    name: datascrub-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

datascrub:
  storage:
    # Kök dizindeki ortak storage klasörüne işaret eder (Docker'da env variable ile ezilebilir)
    base-dir: ${STORAGE_BASE_DIR:../storage}
  engine:
    url: ${PYTHON_ENGINE_URL:http://localhost:8000}